# Uptime check for give.koivikko.org and its backend. Runs every 15 minutes; a failed run makes
# GitHub email the people watching this repository's Actions (the account that last changed this
# schedule gets failure emails by default). GitHub may delay scheduled runs at busy times, and
# pauses them after 60 days without commits in this repository: re-enable under Actions if so.
name: Uptime (give.koivikko.org)

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Page, backend and certificate
        run: |
          fail=0
          check() { # name, command
            if out=$(eval "$2" 2>&1); then echo "ok    $1  $out"; else echo "FAIL  $1  $out"; fail=1; fi
          }
          retry() { for i in 1 2 3; do curl -fsS -m 20 "$@" && return 0; sleep 10; done; return 1; }

          check "page /en" "retry -o /dev/null -w '%{http_code}' https://give.koivikko.org/en"
          check "security headers" "retry -I https://give.koivikko.org/ | grep -qi \"^content-security-policy: frame-ancestors 'none'\" && echo present"
          check "backend /stats" "retry -H 'Origin: https://give.koivikko.org' https://koivikko-donate.koivikko-donate-backend.workers.dev/stats | grep -q '\"currency\"' && echo answers"
          check "certificate > 14 days" "end=\$(echo | openssl s_client -connect give.koivikko.org:443 -servername give.koivikko.org 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2); left=\$(( (\$(date -d \"\$end\" +%s) - \$(date +%s)) / 86400 )); echo \"\$left days left\"; [ \$left -gt 14 ]"

          exit $fail
