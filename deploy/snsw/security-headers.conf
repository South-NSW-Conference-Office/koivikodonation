# Security headers for every response (pages, files and errors). Included in each location of
# site.conf, because nginx drops server-level add_header lines in any location that adds its own.
#
# Same list as the "/*" block of site/_headers (the Cloudflare sandbox copy), with one exception:
# Strict-Transport-Security is NOT sent here. On snswserver the shared nginx-proxy in front of
# this container already adds "Strict-Transport-Security: max-age=31536000" to every HTTPS
# response, and sending it twice would give browsers a duplicate header.
# frontend-tests/headers.test.mjs checks that this file and site/_headers stay in step.

# Nobody may show the page inside a frame on another site (clickjacking over Donate / Copy IBAN)
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
# Browsers must use the file type we send
add_header X-Content-Type-Options "nosniff" always;
# Other sites only see "give.koivikko.org", never campaign tags or the Stripe session id
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# No camera, microphone, location or payment sheet (Stripe Checkout runs on Stripe's site)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
# Pages opened from here (WhatsApp, Facebook, OCI) can't reach back into this tab
add_header Cross-Origin-Opener-Policy "same-origin" always;
