# give.koivikko.org: static donation page served from the koivikko-give container on snswserver.
# HTTPS, certificates and the public hostname are handled by the shared nginx-proxy in front;
# this server only answers plain HTTP on port 8080 inside the edge-koivikko Docker network.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;
  autoindex off;
  # Redirects stay relative ("/thank-you"), so they never point at the internal port or http://
  absolute_redirect off;

  charset utf-8;
  charset_types text/css application/javascript text/plain application/xml image/svg+xml;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

  # A static page: nothing may be posted to it
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }

  include /etc/nginx/snippets/security-headers.conf;

  # Pretty addresses (same as the preview server: frontend-tests/server.js ROUTES)
  location = /                 { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache" always; try_files /index.html =404; }
  location ~ ^/(en|fi)/?$      { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache" always; try_files /index.html =404; }
  location = /thank-you        { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache" always; try_files /thank-you.html =404; }
  location = /donate-cancelled { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache" always; try_files /donate-cancelled.html =404; }

  # Old-style addresses go to the pretty ones (query string kept, e.g. ?session_id=)
  location = /index.html            { include /etc/nginx/snippets/security-headers.conf; return 301 /$is_args$args; }
  location = /thank-you.html        { include /etc/nginx/snippets/security-headers.conf; return 301 /thank-you$is_args$args; }
  location = /donate-cancelled.html { include /etc/nginx/snippets/security-headers.conf; return 301 /donate-cancelled$is_args$args; }

  # security.txt is the only hidden path that is published; every other dot-file is refused
  location ^~ /.well-known/ { include /etc/nginx/snippets/security-headers.conf; try_files $uri =404; }
  location ~ /\.            { include /etc/nginx/snippets/security-headers.conf; return 404; }

  # Other pages (oci.html): always checked for a newer copy
  location ~ \.html$ { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache" always; try_files $uri =404; }

  # Scripts and styles: the pages load them with ?v=N, which changes on every edit, so a short
  # cache is safe; one hour limits the damage if someone forgets to bump a ?v=
  location ~* \.(js|css)$ { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "public, max-age=3600" always; try_files $uri =404; }

  # Photos, flags, logos and fonts change rarely
  location ~* \.(png|jpe?g|webp|svg|ico|woff2)$ { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "public, max-age=86400" always; try_files $uri =404; }

  # Everything else (robots.txt, sitemap.xml) as-is; no folder listings, no fallbacks
  location / { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache" always; try_files $uri =404; }
}
